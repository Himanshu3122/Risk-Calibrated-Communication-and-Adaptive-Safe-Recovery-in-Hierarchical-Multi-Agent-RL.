[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricor"
version = "0.1.0"
description = "Risk-calibrated communication and adaptive safe recovery for hierarchical multi-agent RL (research implementation)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Himanshu" }]
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  "torch>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ricor-train = "ricor.cli:train_main"
ricor-evaluate = "ricor.cli:evaluate_main"
ricor-infer = "ricor.cli:infer_main"
ricor-aggregate = "ricor.cli:aggregate_main"
ricor-scenarios = "ricor.cli:scenarios_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]